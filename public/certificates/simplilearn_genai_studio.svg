<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <rect width="1200" height="850" fill="#ffffff" />

  <!-- Outer Border Frame -->
  <rect x="40" y="40" width="1120" height="770" fill="none" stroke="#e2e8f0" stroke-width="2.5" rx="6" />

  <!-- Left Header: Google Cloud -->
  <g transform="translate(100, 110)">
    <text x="0" y="0" font-size="16" fill="#64748b">Powered by</text>
    <text x="0" y="32" font-size="34" font-weight="bold" fill="#4285f4">Google <tspan fill="#5f6368">Cloud</tspan></text>
  </g>

  <!-- Right Header: Simplilearn SkillUp -->
  <g transform="translate(1100, 130)" text-anchor="end">
    <text x="0" y="0" font-size="34" font-weight="900" fill="#f97316">simpli<tspan fill="#334155">learn</tspan> <tspan fill="#0284c7">Skill</tspan><tspan fill="#0ea5e9">UP</tspan></text>
  </g>

  <!-- Title Area -->
  <g transform="translate(600, 270)" text-anchor="middle">
    <text x="0" y="0" font-size="28" font-weight="600" fill="#475569" letter-spacing="4">DECLARATION OF</text>
    <text x="0" y="65" font-family="'Times New Roman', Times, serif" font-size="70" font-weight="bold" fill="#0f172a" letter-spacing="3">COMPLETION</text>
  </g>

  <!-- Recipient Name -->
  <g transform="translate(600, 425)" text-anchor="middle">
    <text x="0" y="0" font-family="'Times New Roman', Times, serif" font-size="44" font-weight="bold" fill="#0f172a" letter-spacing="1">THARSAN M</text>
    <line x1="-240" y1="18" x2="240" y2="18" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="3,3" />
  </g>

  <!-- Body Text -->
  <g transform="translate(600, 500)" text-anchor="middle">
    <text x="0" y="0" font-size="20" fill="#64748b">has successfully completed the online course:</text>
    <text x="0" y="44" font-size="32" font-weight="bold" fill="#0f172a">Introduction to Generative AI Studio</text>
    <text x="0" y="94" font-size="19" fill="#475569">This professional has demonstrated initiative and a commitment to</text>
    <text x="0" y="122" font-size="19" fill="#475569">deepening their skills and advancing their career. Well done!</text>
  </g>

  <!-- Footer Dates & Certificate Code -->
  <g transform="translate(100, 725)">
    <text x="0" y="0" font-size="21" font-weight="600" fill="#0f172a">1st July 2025</text>
    <text x="0" y="32" font-size="21" fill="#334155">Certificate code : <tspan font-weight="bold" fill="#0f172a">8550053</tspan></text>
    <text x="0" y="60" font-size="13" fill="#94a3b8">This certification is issued solely for the purpose of acknowledging completion of Google Cloud Courses on the Simplilearn portal and is not an official Google Cloud Certification.</text>
  </g>

  <!-- Signature -->
  <g transform="translate(1020, 730)" text-anchor="middle">
    <path d="M -50,-30 Q -30,-60 -10,-20 Q 10,0 20,-35 Q 40,-10 60,-40" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <text x="0" y="0" font-size="18" font-weight="bold" fill="#334155">Krishna Kumar</text>
    <text x="0" y="24" font-size="16" fill="#64748b">CEO, Simplilearn</text>
  </g>

  <!-- Google Cloud 4-color bottom stripes -->
  <g transform="translate(850, 810)">
    <polygon points="0,0 30,-16 60,-16 30,0" fill="#4285f4" />
    <polygon points="35,0 65,-16 95,-16 65,0" fill="#ea4335" />
    <polygon points="70,0 100,-16 130,-16 100,0" fill="#fbbc05" />
    <polygon points="105,0 135,-16 165,-16 135,0" fill="#34a853" />
  </g>
</svg>
