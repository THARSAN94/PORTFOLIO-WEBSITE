<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <rect width="1200" height="850" fill="#ffffff" />

  <!-- Top Curved Color Arc (Red/Crimson to Dark Red) -->
  <path d="M 0,180 Q 600,380 1200,180 L 1200,240 Q 600,440 0,240 Z" fill="#dc2626" opacity="0.9" />

  <!-- Left Header: futureskills prime -->
  <g transform="translate(80, 70)">
    <text x="0" y="0" font-size="34" font-weight="900" fill="#0284c7">futureskills<tspan fill="#38bdf8">°</tspan></text>
    <text x="0" y="24" font-size="18" font-weight="bold" fill="#ea580c" letter-spacing="4">prime</text>
    <text x="0" y="44" font-size="12" fill="#64748b">A MeitY - nasscom Digital Skilling Initiative</text>
  </g>

  <!-- Right Header: salesforce -->
  <g transform="translate(1120, 80)" text-anchor="end">
    <ellipse cx="-55" cy="-5" rx="65" ry="36" fill="#0284c7" />
    <text x="-55" y="6" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">salesforce</text>
  </g>

  <!-- Certificate Title -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <text x="0" y="0" font-size="52" font-weight="bold" fill="#0284c7">Certificate of Participation</text>
  </g>

  <!-- Central Ribbon Medal Badge -->
  <g transform="translate(600, 310)" text-anchor="middle">
    <circle cx="0" cy="0" r="70" fill="#f59e0b" stroke="#d97706" stroke-width="3" />
    <circle cx="0" cy="0" r="58" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" />
    <text x="0" y="-12" font-size="12" font-weight="bold" fill="#b45309" letter-spacing="1">COURSE</text>
    <text x="0" y="6" font-size="12" font-weight="bold" fill="#b45309" letter-spacing="1">PARTICIPATION</text>
    <text x="0" y="24" font-size="10" font-weight="bold" fill="#0284c7">futureskills</text>
    <text x="0" y="36" font-size="8" font-weight="bold" fill="#ea580c">prime</text>
  </g>

  <!-- Recipient Name -->
  <g transform="translate(600, 440)" text-anchor="middle">
    <text x="0" y="0" font-family="'Times New Roman', Times, serif" font-size="44" font-weight="bold" font-style="italic" fill="#0f172a">Tharsan M</text>
  </g>

  <!-- Participation text -->
  <g transform="translate(600, 500)" text-anchor="middle">
    <text x="0" y="0" font-size="20" fill="#475569">has participated in</text>
    <text x="0" y="44" font-size="34" font-weight="bold" font-style="italic" fill="#0f172a">Salesforce Becoming an Agentforce Champion</text>
    <text x="0" y="92" font-size="18" fill="#475569">Aligned to Competency Standards developed by SSC NASSCOM</text>
    <text x="0" y="118" font-size="18" fill="#475569">in collaboration with Industry and approved by Government.</text>
  </g>

  <!-- Left: QR Code & Issue Date -->
  <g transform="translate(80, 680)">
    <!-- QR placeholder representation -->
    <rect x="0" y="0" width="70" height="70" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
    <rect x="8" y="8" width="20" height="20" fill="#0f172a" />
    <rect x="42" y="8" width="20" height="20" fill="#0f172a" />
    <rect x="8" y="42" width="20" height="20" fill="#0f172a" />
    <rect x="36" y="36" width="12" height="12" fill="#0f172a" />

    <text x="0" y="95" font-size="13" font-family="monospace" fill="#334155">Certificate ID: FSP/2026/1/4268125</text>
    <text x="0" y="130" font-size="19" font-weight="bold" fill="#0f172a">30/11/2025</text>
    <text x="0" y="152" font-size="15" fill="#64748b">Date of issue</text>
  </g>

  <!-- Right: Signatory -->
  <g transform="translate(1120, 750)" text-anchor="end">
    <path d="M -160,-35 Q -120,-60 -80,-25 Q -40,0 0,-40" stroke="#0f172a" stroke-width="2" fill="none" />
    <text x="0" y="0" font-family="'Times New Roman', Times, serif" font-size="22" font-style="italic" font-weight="bold" fill="#0f172a">Dr. Abhilasha Gaur</text>
    <text x="0" y="24" font-size="16" fill="#475569">CEO, IT-ITeS Sector Skills Council</text>
    <text x="0" y="46" font-size="16" font-weight="bold" fill="#475569">nasscom</text>
  </g>
</svg>
