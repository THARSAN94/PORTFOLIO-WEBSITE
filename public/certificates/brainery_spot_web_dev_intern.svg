<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', Times, 'Liberation Serif', serif;">
  <defs>
    <!-- Filter for authentic stamped ink look -->
    <filter id="subtleInk" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Brainery Spot Leaf Gradients -->
    <linearGradient id="bstGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="bstBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background White Page -->
  <rect width="1200" height="1700" fill="#ffffff" />

  <!-- ==================== TOP LOGO & COMPANY HEADER ==================== -->
  <g transform="translate(100, 75)">
    <!-- Brainery Spot Emblem Logo -->
    <g transform="translate(0, 5)">
      <!-- Left Swirl / Leaf (Vibrant Green) -->
      <path d="M 45,5 C 18,5 2,28 2,52 C 2,78 22,96 48,96 C 40,84 36,70 38,54 C 40,36 50,22 62,12 C 57,7 51,5 45,5 Z" fill="url(#bstGreen)" />
      <!-- Right Swirl / Leaf (Vibrant Cyan Blue) -->
      <path d="M 55,95 C 82,95 98,72 98,48 C 98,22 78,4 52,4 C 60,16 64,30 62,46 C 60,64 50,78 38,88 C 43,93 49,95 55,95 Z" fill="url(#bstBlue)" />
      <!-- Central Overlap Core -->
      <circle cx="50" cy="50" r="10" fill="#047857" />
      <circle cx="50" cy="50" r="5" fill="#ffffff" />
    </g>

    <!-- Company Name & Subtitle -->
    <g transform="translate(120, 0)">
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#0f172a" letter-spacing="0.5">BRAINERY SPOT</text>
      <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#0284c7" letter-spacing="1">TECHNOLOGY</text>
      <text x="0" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#475569" letter-spacing="3">LEARNING | DEVELOPMENT | PLACEMENT</text>
    </g>

    <!-- Date (Right aligned) -->
    <g transform="translate(1000, 48)" text-anchor="end">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Date: <tspan font-weight="600" fill="#334155">18/07/2024</tspan></text>
    </g>
  </g>

  <!-- Top Divider Line -->
  <line x1="80" y1="210" x2="1120" y2="210" stroke="#000000" stroke-width="4.5" />

  <!-- Document Title -->
  <g transform="translate(600, 460)">
    <text x="0" y="0" font-size="38" font-weight="bold" text-anchor="middle" letter-spacing="3" fill="#000000">TO WHOM IT MAY CONCERN</text>
    <line x1="-275" y1="14" x2="275" y2="14" stroke="#000000" stroke-width="3" />
  </g>

  <!-- Main Certificate Body Content -->
  <g font-size="31" fill="#111111" text-anchor="middle">
    <!-- Sentence 1 -->
    <text x="600" y="575">This is to certify that <tspan font-weight="bold">Tharsan M</tspan> (Reg.No: <tspan font-weight="bold">922523243115</tspan>) studying</text>
    <text x="600" y="625"><tspan font-weight="bold">B Tech(AI&amp;DS)</tspan> from <tspan font-weight="bold">VSB Engineering College</tspan> has successfully completed</text>
    <text x="600" y="675">the</text>
    <text x="600" y="725">internship work under the domain of <tspan font-weight="bold">"Web Development"</tspan> in our organization</text>
    <text x="600" y="775">during the period of <tspan font-weight="bold">18/06/2024 to 18/07/2024</tspan>.</text>

    <!-- Paragraph 2 -->
    <text x="600" y="895">During this period of his internship with us, his conduct and character were</text>
    <text x="600" y="945">found to be Good.</text>
    
    <!-- Paragraph 3 -->
    <text x="600" y="1015">We wish him all the best for his future endeavors.</text>
  </g>

  <!-- Signoff & Seal Section -->
  <g transform="translate(120, 1110)">
    <text x="0" y="0" font-size="31" fill="#111111">With Warm &amp; Regards,</text>

    <!-- Handwritten Signature Graphic -->
    <g transform="translate(20, 30)">
      <!-- Signature Stroke (Deep Blue / Navy Ink) -->
      <path d="M 5,55 Q 30,-10 52,68 Q 72,-5 90,45 Q 105,18 125,52 Q 140,25 162,48 Q 185,32 205,55" 
            stroke="#1e3a8a" stroke-width="4.2" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleInk)" />
      <!-- Signature flourishes -->
      <path d="M 45,36 Q 110,30 180,34" stroke="#1e3a8a" stroke-width="3.2" fill="none" stroke-linecap="round" filter="url(#subtleInk)" />
      <path d="M 115,18 Q 150,62 185,38" stroke="#1e3a8a" stroke-width="3.2" fill="none" stroke-linecap="round" filter="url(#subtleInk)" />
    </g>

    <!-- Official Stamp Seal (Circular Stamp with Soft Violet/Navy Ink) -->
    <g transform="translate(420, 95)">
      <!-- Outer Double Rings -->
      <circle cx="0" cy="0" r="75" fill="none" stroke="#3730a3" stroke-width="2.8" opacity="0.82" />
      <circle cx="0" cy="0" r="69" fill="none" stroke="#3730a3" stroke-width="1.8" opacity="0.82" />
      
      <!-- Circular Arc Top Text -->
      <path id="bstSealUpperArc" d="M -56,0 A 56,56 0 1,1 56,0" fill="none" />
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#312e81" opacity="0.85" letter-spacing="1.5">
        <textPath href="#bstSealUpperArc" startOffset="50%" text-anchor="middle">
          BRAINERY SPOT TECHNOLOGY
        </textPath>
      </text>

      <!-- Circular Arc Bottom Text -->
      <path id="bstSealLowerArc" d="M -56,0 A 56,56 0 0,0 56,0" fill="none" />
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#312e81" opacity="0.85" letter-spacing="2">
        <textPath href="#bstSealLowerArc" startOffset="50%" text-anchor="middle">
          ★ COIMBATORE ★
        </textPath>
      </text>

      <!-- Center Inner Box & Address / Pin Details -->
      <rect x="-42" y="-20" width="84" height="40" fill="none" stroke="#3730a3" stroke-width="1.4" opacity="0.75" />
      <text x="0" y="-2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#312e81" text-anchor="middle">RAM NAGAR</text>
      <text x="0" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#312e81" text-anchor="middle">641 009</text>
    </g>

    <!-- Signer Role & Company Details -->
    <text x="0" y="195" font-size="31" fill="#111111">Authorized Signatory</text>
    <text x="0" y="240" font-size="31" fill="#111111">Brainery Spot Technology</text>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="80" y1="1440" x2="1120" y2="1440" stroke="#000000" stroke-width="4.5" />

  <!-- Footer Contact Info -->
  <g transform="translate(1080, 1485)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#111111" text-anchor="end">
    <text x="0" y="0" font-weight="bold">Brainery Spot Technology</text>
    <text x="0" y="28" font-size="18" fill="#334155">2nd Floor, 39, Ansari St, Ram Nagar, Coimbatore - 641 009</text>
    <text x="0" y="56" font-size="18">Web: www.braineryspot.com</text>
    <text x="0" y="84" font-size="18">Email: braineryspot@gmail.com | Phone: +91 98944 50083</text>
  </g>
</svg>
